name: Release

# Builds the patch bundle and attaches it to a GitHub release, so the repository is a
# usable Morphe source:
#
#   https://github.com/<owner>/<repo>/releases/latest/download/patches-bundle.json
#
# The bundle is named patches-<version>.mpp because the manifest's downloadUrlTemplate
# points at releases/download/v<version>/patches-<version>.mpp.
#
# Signing is optional. Without MORPHE_SIGNING_KEY the bundle is published unsigned and
# consumers fall back to a checksum; add the secret to publish signed bundles.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Release
    # Publishing is main-only, matching upstream's policy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
      SHARED_MAPS_API_KEY: ${{ secrets.SHARED_MAPS_API_KEY }}
      BRIGHT_ARTICLE_SIGNING_KEY: ${{ secrets.BRIGHT_ARTICLE_SIGNING_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build the bundle
        run: |
          set -euo pipefail
          # The bundle's own manifest is what Morphe displays as the source version, so it has to
          # carry the version this release is named after. Leaving the checked-in value made every
          # release report upstream's 1.91.0.
          sed -i "s/^version = .*/version = ${{ steps.version.outputs.version }}/" gradle.properties
          grep -E '^version = ' gradle.properties
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Test the BYD extension
        run: ./gradlew :extensions:maps-gearslip:testDebugUnitTest --no-daemon

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # Characterisation does not depend on tag ancestry: a shallow checkout cannot describe
          # anything, so the highest existing tag is the anchor and its version is compared with
          # the commit subjects since it.
          highest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "${highest}" ]; then
            echo 'No v* tag exists, so the next version is undefined.' >&2
            echo 'Push the tags from the source repository, then re-run.' >&2
            exit 1
          fi
          highest="${highest#v}"
          major="$(cut -d. -f1 <<<"${highest}")"
          minor="$(cut -d. -f2 <<<"${highest}")"
          base="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "${base}" ]; then
            # Tag ancestry is available: a feature since it bumps the minor version.
            if git log --pretty=%s "${base}"..HEAD | grep -qE '^feat(\(|:)'; then
              version="${major}.$((minor + 1)).0"
            else
              version="${major}.${minor}.$(( $(cut -d. -f3 <<<"${highest}") + 1 ))"
            fi
          else
            # No ancestry: our commits cannot be compared with the anchor, so take a patch bump.
            version="${major}.${minor}.$(( $(cut -d. -f3 <<<"${highest}") + 1 ))"
          fi
          # A tag that exists upstream but not in our history still reserves the version.
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already tagged; refusing to reuse it" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}"

      - name: Collect the bundle
        id: bundle
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          built="$(find patches/build/libs -name 'patches-*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -1)"
          if [ -z "${built}" ]; then
            echo 'No bundle was produced' >&2
            exit 1
          fi
          mkdir -p dist
          cp "${built}" "dist/patches-${version}.mpp"
          sha256sum "dist/patches-${version}.mpp" | cut -d' ' -f1 > "dist/patches-${version}.mpp.sha256"
          echo "file=patches-${version}.mpp" >> "$GITHUB_OUTPUT"

      - name: Sign the bundle
        if: env.SIGNING_KEY != ''
        run: |
          set -euo pipefail
          file='dist/${{ steps.bundle.outputs.file }}'
          printf '%s' "${SIGNING_KEY}" > signing.key
          openssl dgst -sha256 -sign signing.key -out "${file}.asc" "${file}"
          rm -f signing.key
          # The manifest publishes this key; keep it in the repository, not in the release.
          if [ ! -f morphe-signing.pub ]; then
            openssl rsa -in signing.key -pubout -out morphe-signing.pub 2>/dev/null || true
          fi

      - name: Write the discovery manifest
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          file='${{ steps.bundle.outputs.file }}'
          repository="${GITHUB_REPOSITORY}"
          checksum="$(cat "dist/${file}.sha256")"
          python3 - "$version" "$file" "$repository" "$checksum" > dist/patches-bundle.json <<'PY'
          import json, sys
          version, file, repo, checksum = sys.argv[1:5]
          download = f"https://github.com/{repo}/releases/download/v{version}/{file}"
          manifest = {
              "version": version,
              "downloadUrl": download,
              "signatureUrl": download + ".asc",
              "checksum": checksum,
              "signatureUrlTemplate": "",
              "publicKeyPath": "morphe-signing.pub",
          }
          json.dump(manifest, sys.stdout, indent=2)
          print()
          PY

      - name: Write the release notes
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          {
            echo "# BYD Maps patches v${version}"
            echo
            sed -n '3,200p' .github/release-notes.md
            echo
            echo "## Changes since ${previous:-the first release}"
            echo
            if [ -n "${previous}" ]; then
              git log --no-merges --pretty='- %s (`%h`)' "${previous}"..HEAD
            else
              git log --no-merges --pretty='- %s (`%h`)' -20
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} is already published; nothing to do"
            exit 0
          fi
          gh release create "v${version}" dist/* \
            --title "BYD Maps patches v${version}" \
            --notes-file release-notes.md
